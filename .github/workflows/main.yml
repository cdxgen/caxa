name: npm test and release

# merge_group lets the merge queue re-run the checks (the test matrix and
# cross-stubs) on the speculative merge commit. Skipping the matrix there
# would leave required checks like "test (ubuntu-24.04, 24.x)" unreported
# and stall the queue in AWAITING_CHECKS.
on:
  push:
    branches:
      - main
      - release/*
    tags:
    - 'v*'
  workflow_dispatch:
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, macos-latest, macos-15-intel, ubuntu-22.04, ubuntu-24.04, ubuntu-22.04-arm, ubuntu-24.04-arm]
        node-version: ['22.15.0', '24.x', '25.x', '26.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - run: node scripts/setup-upx.mjs
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: stable
          # npm test checks the stub with cargo fmt and clippy.
          components: rustfmt, clippy
      # Each runner only needs (and tests) its own stub; the release job
      # cross-compiles all targets.
      - run: |
          npm ci
          npm run prepare
          npm test
        env:
          CAXA_STUBS: host

  cross-stubs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '26.x'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: stable
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2.2.1
        with:
          version: 0.16.0
          use-cache: false
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519  # v2.90.5
        with:
          tool: cargo-zigbuild@0.23.4
      # Same cross-compile the release job runs, exercised on every PR.
      - run: |
          node scripts/build-stubs.mjs
          ls -l stubs/stub--*
          file stubs/stub--*

  npm-publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, cross-stubs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '26.x'
          registry-url: https://registry.npmjs.org/
          scope: '@cdxgen'
          package-manager-cache: false
      - run: node scripts/setup-upx.mjs
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2.2.1
        with:
          version: 0.16.0
          use-cache: false
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519  # v2.90.5
        with:
          tool: cargo-zigbuild@0.23.4
      - run: |
          npm ci
          npm run prepare
          npm test
          npm publish --access=public
