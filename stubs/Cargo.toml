[package]
name = "caxa-stub"
version = "4.0.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "caxa self-extracting runtime stub"
license = "MIT"

[[bin]]
name = "caxa-stub"
path = "src/main.rs"

[dependencies]
tar = { version = "0.4.46", default-features = false }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
# experimental: the stable output buffer of the in-place decode.
zstd = { version = "0.14", default-features = false, features = ["experimental"] }

# Background prefetch: setpriority and kill for the pid lock.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
zstd = "0.14"
tar = "0.4.46"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Size-optimised stub, but keep the hot decompression path fast.
[profile.release.package.zstd-sys]
opt-level = 3
[profile.release.package.miniz_oxide]
opt-level = 3
